<div class="date input-container">
  <div class="date-control">
    <mat-form-field appearance="outline">
      <mat-label>{{ label() }}</mat-label>
      <mat-date-range-input [formGroup]="range" [rangePicker]="picker">
        <input
          matStartDate
          formControlName="start"
          [placeholder]="'date.range.start' | translate"
        />
        <input matEndDate formControlName="end" [placeholder]="'date.range.end' | translate" />
      </mat-date-range-input>
      <mat-hint>{{ dateInputHint }} – {{ dateInputHint }}</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>

      @if (help()) {
        <hmdm-help-tooltip matSuffix [text]="help()" />
      }
    </mat-form-field>
  </div>
  <button class="date-btn" matIconButton (click)="onClear()">
    <mat-icon>clear</mat-icon>
  </button>
</div>
