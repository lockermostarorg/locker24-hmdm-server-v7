name: Server CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create build.properties from the examples
        run: |
          cp server/build.properties.example server/build.properties
          cp plugins/audit/build.properties.example plugins/audit/build.properties

      - name: Build and test
        run: mvn -B package

  sql-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the SQL checks
        run: |
          for f in plugins/locker24-health/src/test/sql/*-check.sh server/src/test/sql/*-check.sh; do
            echo "== $f"
            bash "$f"
          done

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --no-banner --exit-code 1
