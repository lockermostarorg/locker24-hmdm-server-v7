name: Server CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create build.properties from the examples
        run: |
          cp server/build.properties.example server/build.properties
          cp plugins/audit/build.properties.example plugins/audit/build.properties

      - name: Build and test
        run: mvn -B package
