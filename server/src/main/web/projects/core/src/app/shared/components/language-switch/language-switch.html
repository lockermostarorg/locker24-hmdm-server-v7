<button
  matButton
  class="language-switch"
  [matMenuTriggerFor]="menu"
  [attr.aria-label]="'menu.language' | translate"
>
  <mat-icon>translate</mat-icon>
  <span class="language-switch-code">{{ currentOption()?.short ?? 'EN' }}</span>
</button>

<mat-menu #menu="matMenu">
  @for (option of options; track option.code) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.lang]="option.htmlLang"
      [attr.aria-checked]="current() === option.code"
      (click)="select(option.code)"
    >
      <mat-icon>{{ current() === option.code ? 'check' : 'language' }}</mat-icon>
      <span>{{ option.label }}</span>
    </button>
  }
</mat-menu>
