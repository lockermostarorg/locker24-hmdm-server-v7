<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Locker24 MDM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <script>
      (function () {
        var mode = null;
        try {
          mode = window.localStorage.getItem('l24-theme');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          mode = media && media.matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <style>
      /* l24-allow-color-start: dark tokens before styles.css loads; kept equal to theme-tokens.scss */
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #121417;
        --l24-page-bg: #121417;
        --l24-surface: #1b1d22;
        --l24-surface-alt: #22252b;
        --l24-surface-hover: #2a2e35;
        --l24-field-bg: #202328;
        --l24-dialog-bg: #23262c;
        --l24-hover: rgba(255, 255, 255, 0.08);
        --l24-overlay: rgba(18, 20, 23, 0.8);
        --l24-scrim: rgba(0, 0, 0, 0.6);
        --l24-shadow: #000000;
        --l24-text: #e4e7eb;
        --l24-text-muted: #aab1b9;
        --l24-border: #3a3f46;
        --l24-border-strong: #6b727b;
        --l24-primary: #5cc6f2;
        --l24-on-primary: #00293b;
        --l24-link-hover: #8ad6f6;
        --l24-primary-fill: #005f85;
        --l24-on-primary-fill: #ffffff;
        --l24-accent: #ff9d5c;
        --l24-danger: #ff8a80;
        --l24-danger-bg: #3b1d1f;
        --l24-success: #7bcb80;
        --l24-success-bg: #13301f;
        --l24-warning: #ffb86b;
        --l24-warning-fill: #ffb74d;
        --l24-on-warning-fill: #2b1700;
        --l24-sidenav-bg: #1e2227;
        --l24-sidenav-text: #ffffff;
        --l24-sidenav-muted: #a6a6a6;
        --l24-status-ok: #5cc98f;
        --l24-status-error: #ff6f68;
        --l24-status-warn: #ffa726;
        --l24-status-unknown: #9e9e9e;
        --l24-chart-blue: #60a5fa;
        --l24-chart-blue-light: #bfdbfe;
        --l24-chart-red: #ff7a7a;
        --l24-chart-yellow: #eab308;
        --l24-chart-blue-text: #93c5fd;
        --l24-chart-red-text: #ff8a80;
        --l24-chart-yellow-text: #facc15;
        --l24-chart-text: #aab1b9;
        --l24-chart-grid: rgba(255, 255, 255, 0.12);
        --l24-scrollbar-track: #1b1d22;
        --l24-scrollbar-thumb: #5a6068;
        --l24-scrollbar-thumb-hover: #7a8088;
      }
      /* l24-allow-color-end */

      .app-boot-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
      }

      .app-boot-loader__spinner {
        box-sizing: border-box;
        width: 100px;
        height: 100px;
        border: 10px solid transparent;
        border-top-color: #009FD7; /* l24-allow-color */
        border-radius: 50%;
        animation: app-boot-spin 1s linear infinite;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <core-root>
      <div class="app-boot-loader">
        <div class="app-boot-loader__spinner"></div>
      </div>
    </core-root>
  </body>
</html>
