<div class="cell">
  @if (url() || urlArm64() || urlArmeabi()) {
    @if (isSplitApk()) {
      <div class="cell-urls">
        <div class="cell-arch">
          <span class="cell-label"> arm64: </span>

          <a class="cell-value" [href]="urlArm64()" target="_blank" rel="noopener">{{ urlArm64() }}</a>
        </div>

        <div class="cell-arch">
          <span class="cell-label">armeabi:</span>
          <a class="cell-value" [href]="urlArmeabi()" target="_blank" rel="noopener">{{ urlArmeabi() }}</a>
        </div>
      </div>
    } @else {
      <a class="cell-url" [href]="url()" target="_blank" rel="noopener">{{ url() }}</a>
    }
  }
</div>
